name: Python checks
on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
